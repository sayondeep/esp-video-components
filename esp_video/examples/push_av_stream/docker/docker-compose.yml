services:

  # -----------------------------------------------------------------------
  # nagare-media/ingest — DASH-IF Interface-2 ingest server (plain HTTP)
  #
  # Usage:
  #   docker compose up nagare
  #
  # Configure the ESP32 firmware (idf.py menuconfig):
  #   Example Configuration → Ingest Server
  #     Server type : nagare-media/ingest (plain HTTP)
  #     Host        : <this machine's LAN IP>
  #     Port        : 8080
  #     Track name  : video1  (or whatever you set)
  #
  # Playback URL (substitute track name for {track}):
  #   http://<HOST>:8080/dash/{track}.str/manifest.mpd
  # -----------------------------------------------------------------------
  nagare:
    image: ghcr.io/nagare-media/ingest:dev
    container_name: nagare-ingest
    ports:
      - "8080:8080"
    volumes:
      - ./recordings:/recordings
    configs:
      - source: nagare_config
        target: /etc/nagare-media/ingest/config.yaml
    networks:
      - media-network
    restart: unless-stopped

networks:
  media-network:
    driver: bridge

# Inline config — no separate file needed, works from any directory.
configs:
  nagare_config:
    content: |
      apiVersion: ingest.nagare.media/v1alpha1
      kind: Config

      servers:
        - name: default
          address: :8080
          http: {}
          apps:
            - name: dash_serve
              http:
                host: "**"
                path: /dash
                cors:
                  allowOrigins: "*"
                  allowMethods: GET,HEAD,OPTIONS
                  allowHeaders: "*"
                  maxAge: 86400
              genericServe:
                appRef:
                  name: dash_ingest
                volumeRefs:
                  - name: storage

            - name: dash_ingest
              http:
                host: "**"
                path: /dash
              dashAndHlsIngest:
                volumeRef:
                  name: storage

      volumes:
        - name: storage
          fs:
            path: /recordings
