# nginx TLS termination proxy for nagare-media/ingest
#
# Listens on :8443 (HTTPS) and forwards all requests to nagare on :8080 (HTTP)
# within the Docker internal network.
#
# Key settings for CMAF/fMP4 ingest via PUT:
#   proxy_request_buffering off  — stream the PUT body directly to nagare without
#                                  buffering it in nginx first (avoids ESP32 timeouts)
#   client_max_body_size 4m      — a 1 Mbps 1-second segment ≈ 125 KB; 4 MB gives
#                                  plenty of headroom even at higher bitrates
#   proxy_http_version 1.1       — keep-alive connections (reused by esp_http_client)

server {
    listen      8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;

    location / {
        proxy_pass              http://nagare-ingest:8080;
        proxy_http_version      1.1;
        # Clear Connection header so keep-alive is negotiated end-to-end
        proxy_set_header        Connection "";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # Do not buffer PUT request bodies — pass them through immediately.
        # Without this, nginx holds the entire segment in memory before
        # forwarding, causing ESP32 client timeouts.
        proxy_request_buffering off;

        # Do not buffer responses (MPD, serve responses) either.
        proxy_buffering         off;

        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
        proxy_send_timeout      30s;
    }
}
