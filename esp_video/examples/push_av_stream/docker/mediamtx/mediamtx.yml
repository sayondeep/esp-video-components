# MediaMTX Configuration for CMAF/DASH Ingest
# This allows HTTP PUT of CMAF segments

# Logging
logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

# API
api: "yes"
apiAddress: :8888

# Metrics
metrics: "yes"
metricsAddress: :9998

# Playback
playback: "yes"
playbackAddress: :8889

# Paths configuration
paths:
  # Default path for ESP32 streams
  esp32-stream:
    # Source configuration - accept HTTP PUT
    source: publisher
    sourceProtocol: http
    sourceOnDemand: no

    # Enable DASH output
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

    # Recording (optional)
    record: no

    # Playback
    readUser: ""
    readPass: ""

    # Publish (for HTTP PUT)
    publishUser: ""
    publishPass: ""

    # HLS/DASH output
    hls: "yes"
    hlsSegmentCount: 3
    hlsSegmentDuration: 1s

    # DASH output
    dash: "yes"
    dashSegmentCount: 3
    dashSegmentDuration: 1s

  # Wildcard path for any stream name
  "~^.*$":
    source: publisher
    sourceProtocol: http
    sourceOnDemand: no
    hls: "yes"
    dash: "yes"
