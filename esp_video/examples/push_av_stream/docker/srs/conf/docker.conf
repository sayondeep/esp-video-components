# SRS Docker Configuration for CMAF/DASH Ingest
# This config enables HTTP PUT for CMAF segments and DASH output

listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;

# HTTP API for monitoring
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP server for streaming
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# HTTPS server (optional, requires certificates)
# https_server {
#     enabled         on;
#     listen          8443;
#     dir             ./objs/nginx/html;
#     key             ./conf/server.key;
#     cert            ./conf/server.crt;
# }

# DASH output
dash {
    enabled         on;
    dash_fragment   1;          # 1 second segments
    dash_update_period 1;       # Update period
    dash_timeshift  10;         # Timeshift window (seconds)
    dash_path       ./objs/nginx/html;
    dash_mpd_file   [app]/[stream].mpd;
}

# HLS output (optional)
hls {
    enabled         on;
    hls_fragment    1;
    hls_window      10;
    hls_path        ./objs/nginx/html;
    hls_m3u8_file   [app]/[stream].m3u8;
    hls_ts_file     [app]/[stream]-[seq].ts;
}

# HTTP remux for CMAF ingest via PUT
# This allows direct HTTP PUT of segments
http_remux {
    enabled         on;
    mount           [vhost]/[app]/[stream].m4s;
    rtmp_to_http    off;  # Disable RTMP->HTTP, enable direct PUT
}

# Vhost configuration
vhost __defaultVhost__ {
    # Enable HTTP PUT for segment upload
    http_remux {
        enabled     on;
        mount       [app]/[stream].m4s;
    }

    # DASH configuration
    dash {
        enabled     on;
        dash_fragment 1;
        dash_update_period 1;
        dash_timeshift 10;
        dash_path   ./objs/nginx/html;
        dash_mpd_file [app]/[stream].mpd;
    }

    # Play configuration
    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    # Publish configuration (for RTMP, not used for HTTP PUT)
    publish {
        mr             off;
        first_pkt_timeout 20000;
        normal_timeout 20000;
    }
}
